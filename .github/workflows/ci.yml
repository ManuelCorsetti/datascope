name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; don't hand it a token that can write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev and excel extras
        run: pip install -e ".[dev,excel]"

      - name: Run tests
        run: pytest -v

      - name: Smoke-test the example dataset end to end
        run: python example.py
